name: Reproduce frozen analysis
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'CITATION.cff'
  pull_request:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit saved outputs
        run: python reproduce.py
      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay all models and compare outputs
        run: python reproduce.py --full

